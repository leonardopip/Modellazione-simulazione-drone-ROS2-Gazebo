---
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Pose di tutte le entità in movimento (drone, rotori) -> TF
- ros_topic_name: "/tf"
  gz_topic_name: "/world/wind_farm_x3/pose"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/wind_farm_x3/model/x3/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS  

# Comando dei motori del drone
- ros_topic_name: "/X3/gazebo/command/motor_speed"
  gz_topic_name: "/X3/gazebo/command/motor_speed"
  ros_type_name: "actuator_msgs/msg/Actuators"
  gz_type_name: "gz.msgs.Actuators"
  direction: ROS_TO_GZ

- ros_topic_name: "/x3/odometry"
  gz_topic_name: "/model/x3/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/x3/imu"
  gz_topic_name: "/world/wind_farm_x3/model/x3/link/X3/base_link/sensor/imu_sensor/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# Turbine
- ros_topic_name: "/model/turbine_1/joint/rotor_joint/cmd_vel"
  gz_topic_name: "/model/turbine_1/joint/rotor_joint/cmd_vel"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/model/turbine_2/joint/rotor_joint/cmd_vel"
  gz_topic_name: "/model/turbine_2/joint/rotor_joint/cmd_vel"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/model/turbine_3/joint/rotor_joint/cmd_vel"
  gz_topic_name: "/model/turbine_3/joint/rotor_joint/cmd_vel"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ